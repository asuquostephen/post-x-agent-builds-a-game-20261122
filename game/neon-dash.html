<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON DASH — one-tap lane dodger</title>
<style>
  html, body { margin:0; padding:0; background:#05060f; height:100%; overflow:hidden;
    font-family:"Segoe UI", system-ui, sans-serif; -webkit-user-select:none; user-select:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { background:#070818; box-shadow:0 0 60px rgba(0,229,255,.25); touch-action:none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="540" height="960"></canvas></div>
<script>
"use strict";
// NEON DASH — built from one prompt:
// "Build me a neon arcade game: one tap switches lanes, dodge the falling
//  blocks, grab the orbs. Make it fast."
// One file, no dependencies. Tap / click / space = switch lane right,
// left & right arrows (or A/D) steer, tap a side of the screen to go that way.

const W = 540, H = 960;
const LANES = [90, 270, 450];            // lane centres (W/3 each)
const SHIP_Y = H - 150;                  // ship row
const BLOCK_W = 118, BLOCK_H = 46;       // falling block size
const ORB_R = 21;                        // orb radius
const START_SPEED = 380, MAX_SPEED = 920, ACCEL = 15;  // px per second
const SPAWN_EVERY = 0.55;                // seconds between spawns
const ORB_CHANCE = 0.38;                 // share of spawns that are orbs
const ORB_SCORE = 60, FLOW_SCORE = 12;   // points: per orb, per second

const cv = document.getElementById("game");
const ctx = cv.getContext("2d");

function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = (W * s) + "px";
  cv.style.height = (H * s) + "px";
}
window.addEventListener("resize", fit); fit();

let state = "title";           // title | play | over
let shipLane = 1, shipX = LANES[1], shipFrom = LANES[1], shipT = 1;
let entities = [];             // {lane, y, kind: 'block'|'orb', got}
let speed = START_SPEED, spawnT = 0, time = 0;
let score = 0, best = 0, shake = 0, flash = 0, pops = [];

function reset() {
  entities = []; pops = [];
  speed = START_SPEED; spawnT = 0; time = 0; score = 0;
  shipLane = 1; shipFrom = shipX = LANES[1]; shipT = 1; shake = 0; flash = 0;
}

function move(dir) {                       // dir: -1 left, +1 right
  if (state === "title") { state = "play"; return; }
  if (state === "over")  { reset(); state = "play"; return; }
  const next = Math.max(0, Math.min(2, shipLane + dir));
  if (next !== shipLane) { shipFrom = shipX; shipLane = next; shipT = 0; }
}
function tapSide(clientX) {
  const r = cv.getBoundingClientRect();
  const x = (clientX - r.left) / r.width * W;
  if (state !== "play") { move(0); return; }
  move(x < shipX ? -1 : +1);
}
cv.addEventListener("pointerdown", e => tapSide(e.clientX));
window.addEventListener("keydown", e => {
  if (e.code === "ArrowLeft"  || e.code === "KeyA") move(-1);
  else if (e.code === "ArrowRight" || e.code === "KeyD") move(+1);
  else if (e.code === "Space") { e.preventDefault(); move(+1); }
});

function spawn() {
  const lane = Math.floor(Math.random() * 3);
  const kind = Math.random() < ORB_CHANCE ? "orb" : "block";
  entities.push({ lane, y: -60, kind, got: false });
}

function step(dt) {
  time += dt;
  speed = Math.min(MAX_SPEED, START_SPEED + ACCEL * time);
  score += FLOW_SCORE * dt;

  // ship lane slide (0.12 s tween)
  if (shipT < 1) {
    shipT = Math.min(1, shipT + dt / 0.12);
    const k = 1 - Math.pow(1 - shipT, 3);
    shipX = shipFrom + (LANES[shipLane] - shipFrom) * k;
  }

  spawnT -= dt;
  if (spawnT <= 0) { spawn(); spawnT = SPAWN_EVERY; }

  for (const e of entities) {
    e.y += speed * dt;
    if (e.kind === "block") {
      if (Math.abs(e.y - SHIP_Y) < (BLOCK_H + 44) / 2 &&
          Math.abs(LANES[e.lane] - shipX) < (BLOCK_W + 52) / 2) {
        state = "over"; shake = 14; flash = 1;
        best = Math.max(best, Math.floor(score));
      }
    } else if (!e.got) {
      if (Math.abs(e.y - SHIP_Y) < 52 && Math.abs(LANES[e.lane] - shipX) < 56) {
        e.got = true; score += ORB_SCORE;
        pops.push({ x: LANES[e.lane], y: e.y, t: 0, text: "+" + ORB_SCORE });
      }
    }
  }
  entities = entities.filter(e => e.y < H + 80 && !e.got);
  for (const p of pops) { p.t += dt; p.y -= 60 * dt; }
  pops = pops.filter(p => p.t < 0.7);
  if (shake > 0) shake = Math.max(0, shake - 40 * dt);
  if (flash > 0) flash = Math.max(0, flash - 2.2 * dt);
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw() {
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

  // track
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#070818"); g.addColorStop(1, "#0d1030");
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.strokeStyle = "rgba(0,229,255,.28)"; ctx.lineWidth = 3;
  for (let i = 0; i <= 3; i++) {
    ctx.beginPath(); ctx.moveTo(i * 180, 0); ctx.lineTo(i * 180, H); ctx.stroke();
  }
  ctx.strokeStyle = "rgba(255,43,214,.12)"; ctx.lineWidth = 2;
  const off = (time * speed * 0.6) % 120;
  for (let y = -120 + off; y < H; y += 120) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // entities
  for (const e of entities) {
    const x = LANES[e.lane];
    if (e.kind === "block") {
      ctx.shadowColor = "#ff2b4e"; ctx.shadowBlur = 22;
      ctx.fillStyle = "#ff2b4e";
      rr(x - BLOCK_W / 2, e.y - BLOCK_H / 2, BLOCK_W, BLOCK_H, 10); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(255,255,255,.35)";
      rr(x - BLOCK_W / 2 + 8, e.y - BLOCK_H / 2 + 7, BLOCK_W - 16, 8, 4); ctx.fill();
    } else {
      ctx.shadowColor = "#00e5ff"; ctx.shadowBlur = 26;
      ctx.fillStyle = "#aef7ff";
      ctx.beginPath(); ctx.arc(x, e.y, ORB_R, 0, 7); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "#00e5ff"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, e.y, ORB_R + 7 + Math.sin(time * 6) * 2, 0, 7); ctx.stroke();
    }
  }

  // ship (neon triangle)
  ctx.shadowColor = "#ffe94a"; ctx.shadowBlur = 24;
  ctx.fillStyle = "#ffe94a";
  ctx.beginPath();
  ctx.moveTo(shipX, SHIP_Y - 34);
  ctx.lineTo(shipX - 27, SHIP_Y + 24);
  ctx.lineTo(shipX, SHIP_Y + 10);
  ctx.lineTo(shipX + 27, SHIP_Y + 24);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;

  // score pops
  ctx.font = "bold 30px 'Segoe UI', sans-serif"; ctx.textAlign = "center";
  for (const p of pops) {
    ctx.fillStyle = "rgba(0,229,255," + (1 - p.t / 0.7) + ")";
    ctx.fillText(p.text, p.x, p.y);
  }

  // HUD
  ctx.fillStyle = "#eaf6ff"; ctx.font = "bold 44px 'Segoe UI', sans-serif";
  ctx.textAlign = "left"; ctx.fillText(Math.floor(score), 22, 58);
  ctx.fillStyle = "rgba(234,246,255,.55)"; ctx.font = "bold 20px 'Segoe UI', sans-serif";
  ctx.textAlign = "right"; ctx.fillText("BEST " + best, W - 22, 54);

  if (flash > 0) { ctx.fillStyle = "rgba(255,43,78," + flash * .45 + ")"; ctx.fillRect(-20, -20, W + 40, H + 40); }

  if (state === "title") {
    ctx.fillStyle = "rgba(4,5,18,.72)"; ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.textAlign = "center";
    ctx.shadowColor = "#00e5ff"; ctx.shadowBlur = 30;
    ctx.fillStyle = "#00e5ff"; ctx.font = "900 84px 'Segoe UI', sans-serif";
    ctx.fillText("NEON", W / 2, 380);
    ctx.shadowColor = "#ff2bd6"; ctx.fillStyle = "#ff2bd6";
    ctx.fillText("DASH", W / 2, 472);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#eaf6ff"; ctx.font = "bold 30px 'Segoe UI', sans-serif";
    ctx.fillText("TAP TO START", W / 2, 600);
    ctx.fillStyle = "rgba(234,246,255,.6)"; ctx.font = "24px 'Segoe UI', sans-serif";
    ctx.fillText("dodge the red blocks · grab the orbs", W / 2, 648);
  }
  if (state === "over") {
    ctx.fillStyle = "rgba(4,5,18,.66)"; ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff2b4e"; ctx.font = "900 64px 'Segoe UI', sans-serif";
    ctx.fillText("WRECKED", W / 2, 420);
    ctx.fillStyle = "#eaf6ff"; ctx.font = "bold 36px 'Segoe UI', sans-serif";
    ctx.fillText("SCORE " + Math.floor(score), W / 2, 486);
    ctx.fillStyle = "rgba(234,246,255,.65)"; ctx.font = "26px 'Segoe UI', sans-serif";
    ctx.fillText("tap to run it back", W / 2, 548);
  }
  ctx.restore();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state === "play") step(dt);
  else time += dt * 0.25;               // gentle idle scroll on title/over
  draw();
  requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
